<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Program Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Program Assignment System</h1>
        
        <!-- Step 1: Basic Information -->
        <div id="step1" class="form-section">
            <h2>Step 1: Basic Information</h2>
            <form id="form-step1">
                <div class="form-group">
                    <label for="num_students">Number of Students:</label>
                    <input type="number" id="num_students" name="num_students" min="1" required>
                </div>
                
                <div class="form-group">
                    <label for="num_sections">Number of Sections (1-26):</label>
                    <input type="number" id="num_sections" name="num_sections" min="1" max="26" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Next</button>
            </form>
        </div>
        
        <!-- Step 2: Programs per Section -->
        <div id="step2" class="form-section" style="display: none;">
            <h2>Step 2: Programs per Section</h2>
            <p id="step2-summary"></p>
            
            <form id="form-step2">
                <div id="sections-container"></div>
                
                <button type="submit" class="btn btn-primary">Finish Setup</button>
                <button type="button" class="btn btn-secondary" onclick="resetApp()">Start Over</button>
            </form>
        </div>
        
        <!-- Step 4: Random Selection -->
        <div id="step4" class="form-section" style="display: none;">
            <h2>Random Program Assignment</h2>
            
            <div class="info-box">
                <h3>Setup Summary</h3>
                <p><strong>Total Students:</strong> <span id="summary-students"></span></p>
                <p><strong>Total Sections:</strong> <span id="summary-sections"></span></p>
                
                <!-- <h4>Programs by Section:</h4> -->
                <!-- <ul id="programs-summary"></ul> -->
            </div>
            
            <div class="random-section">
                <h3>Random Program Selection</h3>
                <button type="button" class="btn btn-success" onclick="randomizePrograms()">🎲 Click Me</button>
            </div>
            
            <div id="result-box" class="result-box" style="display: none;">
                <h3>🎯 Selected Programs</h3>
                <ul id="result-list" class="result-list"></ul>
            </div>
            
            <button type="button" class="btn btn-secondary" style="margin-top: 20px;" onclick="resetApp()">Start Over</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
